name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # TODO: switch back to --frozen-lockfile once bun.lock is regenerated
      - run: bun install
      - name: Lint and format check
        run: bun run lint:ci

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # TODO: switch back to --frozen-lockfile once bun.lock is regenerated
      - run: bun install
      - name: Type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # TODO: switch back to --frozen-lockfile once bun.lock is regenerated
      - run: bun install
      - name: Run tests with coverage
        run: bun run test:coverage
